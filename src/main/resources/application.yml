server:
  port: ${PORT:${SERVER_PORT:8080}}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 512

spring:
  application:
    name: attendance-management-system
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://admin:Password123@cluster0.dxhx0zh.mongodb.net/ams_db?appName=Cluster0&maxPoolSize=15&minPoolSize=2&maxIdleTimeMS=60000&waitQueueTimeoutMS=5000}
      database: ${MONGODB_DATABASE:ams_db}
      auto-index-creation: true

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}
    json: ${FIREBASE_CREDENTIALS_JSON:}
  project-id: ${FIREBASE_PROJECT_ID:roever-ams}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,https://roevermca.netlify.app,https://*.netlify.app,https://*.vercel.app,*}

logging:
  level:
    root: INFO
    com.ams: INFO
    org.springframework.data.mongodb: INFO

ams:
  storage:
    max-quota-bytes: ${STORAGE_MAX_QUOTA_BYTES:536870912} # 512 MB MongoDB Atlas Free Sandbox
    cleanup-threshold-percent: ${STORAGE_CLEANUP_THRESHOLD:80.0} # 80% trigger
    target-threshold-percent: ${STORAGE_TARGET_THRESHOLD:70.0} # 70% safe target
    retention-min-days: ${STORAGE_RETENTION_MIN_DAYS:90} # Current semester protection (90 days)
