server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: attendance-management-system
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://admin:Password123@cluster0.dxhx0zh.mongodb.net/ams_db?appName=Cluster0}
      database: ${MONGODB_DATABASE:ams_db}
      auto-index-creation: true

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}
    json: ${FIREBASE_CREDENTIALS_JSON:}
  project-id: ${FIREBASE_PROJECT_ID:roever-ams}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,https://roevermca.netlify.app,https://*.netlify.app,https://*.vercel.app,*}

logging:
  level:
    root: INFO
    com.ams: INFO
    org.springframework.data.mongodb: INFO
